<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a1f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Atlas Beyond évolue. Une nouvelle exploration se prépare.">
  <title>Atlas Beyond évolue</title>
  <link rel="icon" href="assets/atlas-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="accessibility.css?v=1.0.0">
  <link rel="stylesheet" href="maintenance.css?v=1.0.0">
  <script src="accessibility.js?v=1.0.0" defer></script>
</head>
<body>
  <main class="maintenance-shell">
    <div class="atmosphere" aria-hidden="true">
      <span class="orbit orbit-one"></span>
      <span class="orbit orbit-two"></span>
      <span class="star star-one"></span>
      <span class="star star-two"></span>
      <span class="star star-three"></span>
    </div>

    <section class="maintenance-card" aria-labelledby="maintenance-title">
      <div class="brand" aria-label="Atlas Beyond">
        <span class="globe" aria-hidden="true"></span>
        <span>Atlas <i>Beyond</i></span>
      </div>

      <p class="eyebrow">Une nouvelle exploration se prépare</p>
      <h1 id="maintenance-title">Atlas <i>Beyond</i><br>évolue.</h1>
      <p class="message">
        Nous façonnons une nouvelle expérience pour aller plus loin,
        autrement. Le voyage reprend bientôt.
      </p>

      <div class="horizon" aria-hidden="true">
        <span class="horizon-line"></span>
        <span class="traveler"></span>
      </div>

      <p class="status"><span aria-hidden="true"></span> Mise à jour en cours</p>
    </section>
  </main>
</body>
</html>
